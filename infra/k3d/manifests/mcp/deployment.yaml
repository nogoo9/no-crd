apiVersion: apps/v1
kind: Deployment
metadata:
  name: nogoo-mcp
  namespace: nogoo9
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nogoo9-mcp
  template:
    metadata:
      labels:
        app: nogoo9-mcp
    spec:
      serviceAccountName: nogoo-mcp
      containers:
        - name: mcp
          image: nogoo9-registry.localhost:5001/kube-mcp:latest
          securityContext:
            allowPrivilegeEscalation: false
          imagePullPolicy: Always
          env:
            - name: BASE_URL
              value: "/nocr"
            - name: UI_TITLE
              value: "nogoo9 Pod Gateway"
            - name: UI_SUBTITLE
              value: "Model Context Protocol Orchestration Sandbox (k3s)"
            - name: TRANSPORT
              value: http
            - name: PORT
              value: "3000"
            - name: NAMESPACE
              value: nogoo9
            - name: THEMES_CONFIGMAP
              value: mcp-themes
            - name: MODE
              value: cluster
            - name: STATELESS
              value: "true"
            - name: AUTH_ENABLED
              value: "true"
            - name: JWT_AUDIENCE
              value: "http://localhost:8080"
            - name: JWKS_URI
              value: "http://keycloak.nogoo9.svc.cluster.local:8080/auth/realms/nogoo9/protocol/openid-connect/certs"
            - name: OAUTH_SERVER_TOKEN_URL
              value: "http://keycloak.nogoo9.svc.cluster.local:8080/auth/realms/nogoo9/protocol/openid-connect/token"
            - name: AUTH_ISSUER
              value: "http://localhost:8080/auth/realms/nogoo9"
            - name: OAUTH_CLIENT_ID
              value: "nogoo9-mcp"
            - name: OAUTH_DISCOVERY_URL
              value: "http://localhost:8080/auth/realms/nogoo9/.well-known/openid-configuration"
            - name: AUTH_ADMIN_ROLE
              value: "nogoo9-admin"
            - name: AUTH_REQUIRED_ADMIN_SCOPE
              value: "nogoo9:admin"
            - name: AUTH_REQUIRED_READ_SCOPE
              value: "mcp:read"
            - name: AUTH_REQUIRED_WRITE_SCOPE
              value: "mcp:write"
            - name: AUTH_SCOPE_JSONPATH
              value: "$.scope"
            - name: AUTH_REQUIRED_READ_ROLE
              value: "mcp-reader"
            - name: AUTH_REQUIRED_WRITE_ROLE
              value: "mcp-writer"
            - name: AUTH_ROLES_JSONPATH
              value: "$.custom_roles"
            - name: AUTH_SUB_JSONPATH
              value: "$.custom_user_id"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /nocr/healthz
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /nocr/healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
