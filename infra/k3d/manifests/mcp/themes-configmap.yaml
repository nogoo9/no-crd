    /* Name: Linear */
    :root {
      --paper: #f7f7f8;
      --surface: #f1f2f4;
      --sunken: #f1f2f4;
      --card: #ffffff;
      --ink: #111217;
      --ink-2: #4b5262;
      --ink-3: #747d90;
      --line: #e2e4e9;
      --line-2: #e2e4e9;
      --accent: #5e6ad2;
      --accent-press: #4d58b3;
      --accent-soft: rgba(94, 106, 210, 0.12);
