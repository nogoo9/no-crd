$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"
layer: "application"

tasks:
  dev:
    command: "bun run src/index.ts"
    env:
      TRANSPORT: http
    options:
      runInCI: false
      persistent: true

  dev-stdio:
    command: "bun run src/index.ts"
    env:
      TRANSPORT: stdio
    options:
      runInCI: false
      persistent: true

  docs-dev:
    command: "bun run docs:dev"
    options:
      runInCI: false
      persistent: true

  inspector:
    command: "bunx @modelcontextprotocol/inspector bun run dist/server-entry.js"
    env:
      TRANSPORT: stdio
      MODE: cluster
      NAMESPACE: nogoo9
      AUTH_ENABLED: "true"
      JWKS_URI: "http://localhost:8080/auth/realms/nogoo9/protocol/openid-connect/certs"
      AUTH_ISSUER: "http://localhost:8080/auth/realms/nogoo9"
      OAUTH_CLIENT_ID: "nogoo9-mcp"
      OAUTH_DISCOVERY_URL: "http://localhost:8080/auth/realms/nogoo9/.well-known/openid-configuration"
      AUTH_ADMIN_ROLE: "nogoo9-admin"
      AUTH_REQUIRED_ADMIN_SCOPE: "nogoo9:admin"
      AUTH_REQUIRED_READ_SCOPE: "mcp:read"
      AUTH_REQUIRED_WRITE_SCOPE: "mcp:write"
      AUTH_SCOPE_JSONPATH: "$.scope"
      AUTH_REQUIRED_READ_ROLE: "mcp-reader"
      AUTH_REQUIRED_WRITE_ROLE: "mcp-writer"
      AUTH_ROLES_JSONPATH: "$.custom_roles"
      AUTH_SUB_JSONPATH: "$.custom_user_id"
    deps:
      - "build"
    options:
      runInCI: false

  build:
    command: "bun run build"
    inputs:
      - "src/**/*"
      - "scripts/**/*"
      - "package.json"
    outputs:
      - "dist/index.js"
      - "dist/server-entry.js"
      - "dist/cli.js"
      - "dist/ui/index.html"
      - "dist/ui/error.html"

  typecheck:
    command: "bun x tsc --noEmit"
    inputs:
      - "src/**/*"
      - "tsconfig.json"

  test:
    command: "bun test src/**/*.test.ts src/*.test.ts"
    inputs:
      - "src/**/*"
      - "**/*.test.ts"

  test-lifecycle:
    command: "bun run scripts/test-lifecycle.ts"
    options:
      runInCI: false
      cache: false

  test-e2e-auth:
    command: "bun run scripts/test-e2e-auth.ts"
    options:
      runInCI: false
      cache: false

  demo:
    command: 'sh -c "moon run k3d:bootstrap && moon run mcp:test-e2e-auth"'
    options:
      runInCI: false
      cache: false

  test-antigravity:
    command: "bun run scripts/run-antigravity-test.ts"
    options:
      runInCI: false
      cache: false

  docker-build:
    command: 'sh -c "docker build -f $MOON_PROJECT_ROOT/Dockerfile -t nogoo9/kube-mcp:latest $MOON_WORKSPACE_ROOT"'
    options:
      runInCI: false

  deploy:
    command: 'sh -c "docker build -f $MOON_PROJECT_ROOT/Dockerfile -t nogoo9-registry.localhost:5001/kube-mcp:latest $MOON_WORKSPACE_ROOT && docker push nogoo9-registry.localhost:5001/kube-mcp:latest && kubectl apply -f $MOON_WORKSPACE_ROOT/infra/k3d/manifests/mcp/ && kubectl -n nogoo9 rollout restart deployment/nogoo-mcp"'
    options:
      runInCI: false
      cache: false

  deploy-wsl:
    command: 'sh -c "docker build -f $MOON_PROJECT_ROOT/Dockerfile -t nogoo9-registry.localhost:5001/kube-mcp:latest $MOON_WORKSPACE_ROOT && docker tag nogoo9-registry.localhost:5001/kube-mcp:latest localhost:5001/kube-mcp:latest && docker push localhost:5001/kube-mcp:latest && kubectl apply -f $MOON_WORKSPACE_ROOT/infra/k3d/manifests/mcp/ && kubectl -n nogoo9 rollout restart deployment/nogoo-mcp"'
    options:
      runInCI: false
      cache: false

  undeploy:
    command: "kubectl delete -f $MOON_WORKSPACE_ROOT/infra/k3d/manifests/mcp/ --ignore-not-found"
    options:
      runInCI: false

  trigger-upgrade-demo:
    command: "kubectl apply -f $MOON_WORKSPACE_ROOT/infra/k3d/manifests/mcp/auth-demo-upgraded.yaml"
    options:
      runInCI: false
      cache: false

  revert-upgrade-demo:
    command: "kubectl apply -f $MOON_WORKSPACE_ROOT/infra/k3d/manifests/mcp/auth-demo.yaml"
    options:
      runInCI: false
      cache: false
