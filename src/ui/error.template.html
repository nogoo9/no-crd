  <title>Error - nogoo9 Pod Manager</title>
  <!-- Tailwind CSS v4 Browser Build -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Google Fonts: Hanken Grotesk, Source Serif 4, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..900;1,8..60,300..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root,
    html[data-theme="light"] {
      --font-serif: "Source Serif 4", Georgia, serif;
      --font-sans: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: "JetBrains Mono", monospace;

      --bg-color: #faf9f5;
      --text-color: #65625b;
      --text-title: #29261b;
      --text-muted: #9a968c;
      --panel-bg: #ffffff;
      --panel-hover-bg: #f1eee5;
      --panel-border: #e7e2d6;
      --accent-color: #D97757;
      --accent-active: #b1543a;
      --error-color: #c64545;
    }
    html.dark,
    html[data-theme="dark"] {
      --bg-color: #1b1a17;
      --text-color: #a6a199;
      --text-title: #f3f0e9;
      --text-muted: #726e66;
      --panel-bg: #2a2825;
      --panel-hover-bg: #232220;
      --panel-border: #34322d;
      --modal-bg: #2a2825;
      --accent-color: #D97757;
      --accent-active: #b1543a;
      --error-color: #c64545;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-color) !important;
      color: var(--text-color) !important;
      transition: background-color 0.3s, color 0.3s;
    }

    h1, h2, h3, .font-serif {
      font-family: var(--font-serif) !important;
      font-weight: 500 !important;
      letter-spacing: -0.02em !important;
      color: var(--text-title) !important;
    }
    
    .theme-border {
      border: 1px solid var(--panel-border) !important;
    }
    .theme-feature-card {
      background-color: var(--panel-bg) !important;
      border: 1px solid var(--panel-border) !important;
    }
    .theme-button-secondary {
      background-color: var(--panel-bg) !important;
      border: 1px solid var(--panel-border) !important;
      color: var(--text-color) !important;
      border-radius: 8px !important;
      font-weight: 500 !important;
      transition: all 0.15s ease-in-out !important;
      cursor: pointer !important;
    }
    .theme-button-secondary:hover {
      background-color: var(--panel-hover-bg) !important;
      color: var(--text-title) !important;
    }
  </style>
  <style id="custom-theme-style"></style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div class="theme-feature-card max-w-lg w-full rounded-2xl p-8 shadow-xl text-center space-y-6">
    <div class="flex justify-center">
      <div class="p-4 bg-red-500/10 rounded-full border border-red-500/20 text-[var(--error-color)]">
        <svg class="w-12 h-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      </div>
    </div>
    
    <div class="space-y-2">
      <h2 class="text-2xl font-serif">An Error Occurred</h2>
      <p id="error-desc" class="text-sm text-[var(--text-muted)] font-medium"></p>
    </div>

    <!-- Error Details block -->
    <div id="error-details-container" class="hidden text-left border theme-border rounded-xl p-4 bg-black/5 dark:bg-black/20 font-mono text-xs space-y-3 select-text">
      <div class="flex justify-between border-b theme-border pb-2">
        <span class="font-bold text-[var(--text-muted)]">ERROR CODE</span>
        <span id="error-code-val" class="font-bold text-[var(--error-color)]"></span>
      </div>
      <div class="pt-1 whitespace-pre-wrap leading-relaxed theme-text-body font-medium" id="error-msg-val"></div>
    </div>

    <div class="pt-4 flex justify-center gap-4">
      <a href="/" id="home-link" class="theme-button-secondary px-6 py-2.5 text-sm">Return to Dashboard</a>
      <button onclick="window.location.reload()" class="theme-button-secondary px-6 py-2.5 text-sm">Retry Request</button>
    </div>
  </div>

  <script>
    // Read theme from localStorage and apply
    function applyTheme() {
      const theme = localStorage.getItem("nocr_theme") || "system";
      const isDark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      if (isDark) {
        document.documentElement.classList.add("dark");
        document.documentElement.setAttribute("data-theme", "dark");
      } else {
        document.documentElement.classList.remove("dark");
        document.documentElement.setAttribute("data-theme", "light");
      }

      // Check for custom CSS themes and apply
      const savedCustomTheme = localStorage.getItem("nocr_custom_theme") || "default";
      if (savedCustomTheme !== "default") {
        const customStyleTag = document.getElementById("custom-theme-style");
        if (customStyleTag) {
          const basePath = window.__NOCR_BASE_URL__ || "";
          fetch(`${basePath}/api/themes/${savedCustomTheme}.css`)
            .then(res => {
              if (res.ok) return res.text();
              throw new Error("Theme load failed");
            })
            .then(css => {
              customStyleTag.innerHTML = css;
            })
            .catch(err => console.error("Error loading theme:", err));
        }
      }
    }
    applyTheme();

    // Populate error details from query parameters
    const params = new URLSearchParams(window.location.search);
    const errorCode = params.get("error") || "Unknown Error";
    const errorMsg = params.get("message") || "No detailed error message provided.";
    
    document.getElementById("error-desc").textContent = errorCode;
    document.getElementById("error-code-val").textContent = errorCode;
    document.getElementById("error-msg-val").textContent = errorMsg;
    document.getElementById("error-details-container").classList.remove("hidden");

    // Fix Return to Dashboard link with base prefix
    const basePath = window.__NOCR_BASE_URL__ || "";
    document.getElementById("home-link").href = basePath || "/";
  </script>
</body>
</html>
