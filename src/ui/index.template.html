  <title>nogoo9 Pod Manager</title>
  <!-- Tailwind CSS v4 Browser Build -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Google Fonts: Hanken Grotesk, Source Serif 4, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..900;1,8..60,300..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-serif: "Source Serif 4", Georgia, "Times New Roman", serif;
      --font-sans: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

      /* default terracotta accent */
      --accent: #c96442;
      --accent-press: #b1543a;
      --accent-soft: #f3e7e0;
      --accent-ink: #ffffff;

      --r-sm: 7px;
      --r-md: 11px;
      --r-lg: 16px;
      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    /* ---------- LIGHT (default) ---------- */
    :root {
      --paper: #faf9f5;
      --surface: #f1eee5;
      --sunken: #eae6da;
      --card: #ffffff;
      --ink: #1f1e1c;
      --ink-2: #65625b;
      --ink-3: #9a968c;
      --line: #e7e2d6;
      --line-2: #d9d3c5;
      --shadow-card: 0 1px 2px rgba(40, 34, 24, 0.04), 0 6px 16px -10px rgba(40, 34, 24, 0.14);
      --shadow-pop: 0 12px 40px -8px rgba(35, 28, 18, 0.22), 0 2px 6px rgba(35, 28, 18, 0.08);
      color-scheme: light;
    }

    /* ---------- DARK (premium) ---------- */
    .dark {
      --paper: #1b1a17;
      --surface: #232220;
      --sunken: #181714;
      --card: #2a2825;
      --ink: #f3f0e9;
      --ink-2: #a6a199;
      --ink-3: #726e66;
      --line: #34322d;
      --line-2: #423f39;
      --accent-soft: #3a2a22;
      --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 20px -12px rgba(0, 0, 0, 0.6);
      --shadow-pop: 0 18px 50px -10px rgba(0, 0, 0, 0.7), 0 2px 8px rgba(0, 0, 0, 0.4);
      color-scheme: dark;
    }

    /* ---------- DENSITY ---------- */
    :root,
    html[data-density="comfortable"] {
      --fs-base: 15px;
      --card-pad: 22px;
      --grid-gap: 20px;
      --row-pad: 13px;
      --section-gap: 44px;
    }
    html[data-density="compact"] {
      --fs-base: 13px;
      --card-pad: 14px;
      --grid-gap: 11px;
      --row-pad: 8px;
      --section-gap: 30px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: var(--fs-base);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 0.25s var(--ease), color 0.25s var(--ease);
    }

    ::selection { background: var(--accent-soft); color: var(--ink); }

    /* custom scrollbars */
    *::-webkit-scrollbar { width: 8px; height: 8px; }
    *::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 99px; border: 2px solid transparent; background-clip: padding-box; }
    *::-webkit-scrollbar-thumb:hover { background: var(--ink-3); background-clip: padding-box; }

    /* type helpers */
    .serif { font-family: var(--font-serif) !important; font-weight: 500 !important; }
    .mono { font-family: var(--font-mono) !important; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--ink-3);
      font-weight: 600;
    }

    h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); }

    /* buttons matching editorial design */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font-family: var(--font-sans); font-size: 0.93em; font-weight: 600;
      padding: 8px 14px; border-radius: var(--r-sm);
      border: 1px solid transparent; cursor: pointer;
      transition: all 0.16s var(--ease); white-space: nowrap;
      line-height: 1.2; user-select: none;
    }
    .btn svg { width: 1.1em; height: 1.1em; }
    .btn-primary { background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); }
    .btn-primary:hover { background: var(--accent-press); border-color: var(--accent-press); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line-2); }
    .btn-ghost:hover { background: var(--surface); border-color: var(--ink-3); }
    .btn-quiet { background: transparent; color: var(--ink-2); border: none; }
    .btn-quiet:hover { background: var(--surface); color: var(--ink); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

    /* card layout */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-card);
      transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease), transform 0.2s var(--ease);
    }
    
    /* interactive cards list animation */
    .card-ws-hover:hover {
      border-color: var(--accent) !important;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -8px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    /* text input controls */
    .theme-text-input {
      background-color: var(--card);
      border: 1px solid var(--line-2);
      color: var(--ink);
      border-radius: var(--r-sm);
      transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
    }
    .theme-text-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    /* badge styling */
    .badge-pill {
      display: inline-flex; align-items: center; gap: 5px;
      font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em;
      text-transform: uppercase; font-weight: 600;
      padding: 3px 8px; border-radius: 999px;
      border: 1px solid var(--line-2); color: var(--ink-2); background: var(--paper);
    }

    /* modal layout overlays */
    .modal-overlay {
      background-color: rgba(24, 23, 21, 0.6);
      backdrop-filter: blur(4px);
      transition: opacity 0.25s var(--ease);
    }

    /* toast custom layout animations */
    .toast-item {
      animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideIn {
      from { transform: translateY(1.5rem) scale(0.95); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
  </style>
